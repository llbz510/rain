name: Harness

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-windows:
    name: Clean Windows Harness
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CI: true
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
      CMAKE_CXX_FLAGS: /utf-8
      CMAKE_C_FLAGS: /utf-8

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install required native tools
        shell: pwsh
        run: |
          choco upgrade llvm --version=22.1.7 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "LLVM installation failed with exit code $LASTEXITCODE" }
          choco upgrade ffmpeg --version=8.1.2 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed with exit code $LASTEXITCODE" }
          'C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify native toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          cmake --version
          clang --version
          ffmpeg -version
          ffprobe -version
          if (-not (Test-Path -LiteralPath (Join-Path $env:LIBCLANG_PATH 'libclang.dll'))) {
            throw "libclang.dll was not found under $env:LIBCLANG_PATH"
          }

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run repository Harness
        run: npm run harness:check

      # Temporary PR100 probe: retain the original failing Harness verdict.
      - name: Diagnose native test imports after failure
        if: failure()
        shell: pwsh
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class RainImportProbe {
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
            public static extern IntPtr LoadLibraryW(string name);
            [DllImport("kernel32.dll", CharSet=CharSet.Ansi, ExactSpelling=true)]
            public static extern IntPtr GetProcAddress(IntPtr module, string name);
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode)]
            public static extern uint GetModuleFileNameW(IntPtr module, StringBuilder path, int size);
            [DllImport("kernel32.dll")]
            public static extern uint SetErrorMode(uint mode);
          }
          "@
          [void][RainImportProbe]::SetErrorMode(3)
          $testBinaries = Get-ChildItem -LiteralPath 'src-tauri/target/debug/deps' -Filter 'rain_lib-*.exe'
          foreach ($binary in $testBinaries) {
            Write-Output "[PR100-native] binary=$($binary.FullName)"
            $imports = & 'C:/Program Files/LLVM/bin/llvm-readobj.exe' --coff-imports $binary.FullName
            $imports | Write-Output
            $module = [IntPtr]::Zero
            $dll = ''
            foreach ($line in $imports) {
              if ($line -match '^  Name: (.+)$') {
                $dll = $Matches[1]
                $module = [RainImportProbe]::LoadLibraryW($dll)
                $errorCode = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
                $resolved = [Text.StringBuilder]::new(2048)
                if ($module -ne [IntPtr]::Zero) {
                  [void][RainImportProbe]::GetModuleFileNameW($module, $resolved, $resolved.Capacity)
                }
                Write-Output "[PR100-native] DLL=$dll resolved=$resolved handle=$module loadError=$errorCode"
              } elseif ($module -ne [IntPtr]::Zero -and $line -match '^  Symbol: (.+) \(\d+\)$') {
                $symbol = $Matches[1]
                if ([RainImportProbe]::GetProcAddress($module, $symbol) -eq [IntPtr]::Zero) {
                  Write-Output "[PR100-native] MISSING_ENTRY DLL=$dll symbol=$symbol"
                }
              }
            }
          }

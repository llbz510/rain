name: Runtime Settings Desktop E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-settings-desktop-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Hosted Windows Runtime Settings Desktop E2E
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CI: true
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
      CMAKE_CXX_FLAGS: /utf-8
      CMAKE_C_FLAGS: /utf-8

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install pinned desktop toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw "Rust installation failed with exit code $LASTEXITCODE" }
          rustup default 1.96.1
          if ($LASTEXITCODE -ne 0) { throw "Rust selection failed with exit code $LASTEXITCODE" }
          choco upgrade llvm --version=22.1.7 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "LLVM installation failed with exit code $LASTEXITCODE" }
          cargo install tauri-driver --version=2.0.6 --locked
          if ($LASTEXITCODE -ne 0) { throw "tauri-driver installation failed with exit code $LASTEXITCODE" }
          'C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:\Program Files\CMake\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install matching WebView2 driver
        shell: pwsh
        run: |
          $runtimeRoots = @()
          if (${env:ProgramFiles(x86)}) {
            $runtimeRoots += Join-Path ${env:ProgramFiles(x86)} 'Microsoft\EdgeWebView\Application'
          }
          if ($env:ProgramFiles) {
            $runtimeRoots += Join-Path $env:ProgramFiles 'Microsoft\EdgeWebView\Application'
          }
          $runtime = $runtimeRoots |
            Where-Object { Test-Path -LiteralPath $_ } |
            ForEach-Object { Get-ChildItem -LiteralPath $_ -Directory } |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $runtime) {
            throw 'Microsoft Edge WebView2 Runtime was not found.'
          }

          $driverVersion = $runtime.Name
          $toolsRoot = Join-Path $env:RUNNER_TEMP 'rain-webview2-driver'
          $archivePath = Join-Path $toolsRoot 'edgedriver_win64.zip'
          $driverDirectory = Join-Path $toolsRoot $driverVersion
          New-Item -ItemType Directory -Force -Path $toolsRoot, $driverDirectory | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri "https://msedgedriver.microsoft.com/$driverVersion/edgedriver_win64.zip" -OutFile $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $driverDirectory -Force
          $driverPath = Join-Path $driverDirectory 'msedgedriver.exe'
          if (-not (Test-Path -LiteralPath $driverPath)) {
            throw "msedgedriver.exe was not found after extracting $archivePath"
          }
          "RAIN_E2E_WEBVIEW2_VERSION=$driverVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $driverDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify desktop toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          $cmakeText = (cmake --version | Out-String).Trim()
          Write-Output $cmakeText
          $cmakeVersionText = [regex]::Match($cmakeText, '\d+(?:\.\d+){2}').Value
          if ([string]::IsNullOrWhiteSpace($cmakeVersionText) -or [version]$cmakeVersionText -lt [version]'4.0.0') {
            throw "CMake 4 or newer is required; observed $cmakeVersionText"
          }
          clang --version
          Get-Command tauri-driver | Select-Object -ExpandProperty Source
          $edgeDriver = Get-Command msedgedriver -ErrorAction Stop
          & $edgeDriver.Source --version
          $driverText = (& $edgeDriver.Source --version | Out-String).Trim()
          $driverVersion = [regex]::Match($driverText, '\d+(?:\.\d+){3}').Value
          Write-Output "Microsoft Edge WebView2 Runtime $env:RAIN_E2E_WEBVIEW2_VERSION"
          if ([string]::IsNullOrWhiteSpace($driverVersion) -or $env:RAIN_E2E_WEBVIEW2_VERSION -ne $driverVersion) {
            throw "Microsoft Edge WebView2 Runtime $env:RAIN_E2E_WEBVIEW2_VERSION does not exactly match msedgedriver $driverVersion"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $env:LIBCLANG_PATH 'libclang.dll'))) {
            throw "libclang.dll was not found under $env:LIBCLANG_PATH"
          }

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run Runtime Settings desktop Judge
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: npm run e2e:runtime-settings

      - name: Upload redacted failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: runtime-settings-desktop-e2e-failure
          path: ${{ runner.temp }}\rain-runtime-settings-e2e-latest-failure\*
          if-no-files-found: ignore
          retention-days: 7
